[project]
name = "stylewise-fit"
version = "0.1.0"
description = "Stylewise body measurement and deterministic fit engine"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "trimesh>=4.0",
    "shapely>=2.0",
    "networkx>=3.0",  # trimesh needs it for section loops in measure.torso_circumference
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "matplotlib>=3.8"]

[project.scripts]
stylewise-fit = "stylewise_fit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stylewise_fit"]

[tool.pytest.ini_options]
pythonpath = ["."]
